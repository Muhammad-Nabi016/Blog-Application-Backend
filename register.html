
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body class="auth-page">

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-container">
        <section class="auth-card">
            <a href="index.html" class="back-link">← Back to Home</a>

            <div class="auth-heading">
                <p class="eyebrow">JOIN OUR COMMUNITY</p>
                <h1>Create your account</h1>
                <p>Start sharing your ideas with the world.</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName"
                           placeholder="Enter your full name" required>
                    <small class="error-message" id="registerNameError"></small>
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail"
                           placeholder="you@example.com" required>
                    <small class="error-message" id="registerEmailError"></small>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword"
                           placeholder="At least 8 characters" required>
                    <small class="error-message" id="registerPasswordError"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           placeholder="Re-enter your password" required>
                    <small class="error-message" id="confirmPasswordError"></small>
                </div>

                <button type="submit" class="btn auth-submit">
                    Create Account
                </button>

                <p id="registerMessage" class="form-message"
                   aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>
        <p>© 2026 BlogSpace. Built for curious minds.</p>
    </footer>

</body>
</html>
